{% extends "base.html" %}

{% block title %}{{ error_title or "Error" }} | PlantDex{% endblock %}

{% block content %}
<div style="text-align: center; max-width: 520px; margin: 4rem auto; padding: 2rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
  <div style="font-size: 3.5rem; margin-bottom: 1rem;">🍂</div>
  <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem;">{{ error_title or "System Notice" }}</h1>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.75rem;">
    {{ error_msg or "An unexpected botanical hiccup occurred. Our gardeners have been alerted." }}
  </p>
  <a href="{{ url_for('dashboard') if current_user else url_for('landing_page') }}" class="btn btn-primary" id="btn-error-home">
    Back to Safety
  </a>
</div>
{% endblock %}
